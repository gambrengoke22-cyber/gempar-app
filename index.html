<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GEMPAR - Gerakan Pilah Sampah Warakas</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <span class="logo">♻️</span>
        <div>
          <h1>GEMPAR</h1>
          <small>Gerakan Pilah Sampah Warakas</small>
        </div>
      </div>
      <button id="btnAdd" class="btn btn-primary"><span>+</span> Tambah</button>
    </div>
  </header>

  <main class="container">
    <section class="stats-grid" id="statsContainer">
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
    </section>

    <section class="filter-bar">
      <div class="filter-group">
        <input type="text" id="searchInput" placeholder="Cari nama, NIK, atau GEM-ID...">
        <select id="rwFilter">
          <option value="">Semua RW</option>
          <option value="01">RW 01</option>
          <option value="02">RW 02</option>
          <option value="03">RW 03</option>
          <option value="04">RW 04</option>
          <option value="05">RW 05</option>
          <option value="06">RW 06</option>
          <option value="07">RW 07</option>
          <option value="08">RW 08</option>
          <option value="09">RW 09</option>
          <option value="10">RW 10</option>
          <option value="11">RW 11</option>
          <option value="12">RW 12</option>
          <option value="13">RW 13</option>
          <option value="14">RW 14</option>
        </select>
        <select id="statusFilter">
          <option value="">Semua Status</option>
          <option value="Aktif">Aktif</option>
          <option value="Nonaktif">Nonaktif</option>
        </select>
        <select id="nikFilter">
          <option value="">Semua NIK</option>
          <option value="1">Valid</option>
          <option value="0">Invalid</option>
        </select>
      </div>
      <div class="filter-actions">
        <button id="btnImport" class="btn btn-outline">📥 Import CSV</button>
        <button id="btnExport" class="btn btn-outline">📤 Export CSV</button>
        <button id="btnInit" class="btn btn-warning" title="Jalankan sekali saat setup">⚙️ Init DB</button>
      </div>
    </section>

    <section class="table-section">
      <div class="table-header">
        <h3>Daftar Anggota Jumantik</h3>
        <span id="tableInfo">Memuat...</span>
      </div>
      <div class="table-wrapper">
        <table id="membersTable">
          <thead>
            <tr>
              <th>No</th>
              <th>GEM-ID</th>
              <th>Nama Lengkap</th>
              <th>NIK</th>
              <th>RW/RT</th>
              <th>Status</th>
              <th>NIK</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="text-center">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>

  <div id="modalForm" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Tambah Anggota</h3>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="memberForm">
        <input type="hidden" id="memberId">
        <div class="form-grid">
          <div class="form-group">
            <label>Nama Lengkap <span class="required">*</span></label>
            <input type="text" id="inpNama" required placeholder="Contoh: Farah Aulia">
          </div>
          <div class="form-group">
            <label>NIK (16 digit)</label>
            <input type="text" id="inpNik" maxlength="16" placeholder="3175xxxxxxxxxxxx">
            <small class="hint">Kosongkan jika belum ada</small>
          </div>
          <div class="form-group">
            <label>RW <span class="required">*</span></label>
            <select id="inpRw" required>
              <option value="">Pilih RW</option>
              <option value="01">RW 01</option>
              <option value="02">RW 02</option>
              <option value="03">RW 03</option>
              <option value="04">RW 04</option>
              <option value="05">RW 05</option>
              <option value="06">RW 06</option>
              <option value="07">RW 07</option>
              <option value="08">RW 08</option>
              <option value="09">RW 09</option>
              <option value="10">RW 10</option>
              <option value="11">RW 11</option>
              <option value="12">RW 12</option>
              <option value="13">RW 13</option>
              <option value="14">RW 14</option>
            </select>
          </div>
          <div class="form-group">
            <label>RT</label>
            <input type="text" id="inpRt" placeholder="01">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="inpStatus">
              <option value="Aktif">Aktif</option>
              <option value="Nonaktif">Nonaktif</option>
            </select>
          </div>
          <div class="form-group">
            <label>GEM-ID (Auto)</label>
            <input type="text" id="inpGemId" readonly placeholder="Otomatis generate">
          </div>
        </div>
        <div class="form-group">
          <label>Keterangan</label>
          <textarea id="inpKeterangan" rows="2" placeholder="Catatan tambahan..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalImport" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Import Data CSV</h3>
        <button class="btn-close" onclick="closeImportModal()">&times;</button>
      </div>
      <div class="import-instructions">
        <p>Format CSV: <code>nama,nik,rw,rt,status,keterangan</code></p>
        <p>Status default: Aktif. NIK auto-validasi 16 digit.</p>
      </div>
      <div class="form-group">
        <label>Upload File CSV</label>
        <input type="file" id="csvFile" accept=".csv">
      </div>
      <div class="form-group">
        <label>Atau paste data CSV di sini</label>
        <textarea id="csvText" rows="6" placeholder="nama,nik,rw,rt,status,keterangan&#10;Farah Aulia,3175...,01,01,Aktif,&#10;..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeImportModal()">Batal</button>
        <button type="button" class="btn btn-primary" onclick="processImport()">Import Sekarang</button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
